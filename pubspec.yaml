# pubspec.yaml - dependências do projeto

name: algarve_explorer
description: App de turismo do Algarve - TP3 Flutter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Gerenciamento de estado
  provider: ^6.1.1
  
  # Persistência local simples
  shared_preferences: ^2.2.2
  
  # Geolocalização
  geolocator: ^10.1.0
  
  # Mapa interativo (open source, gratuito)
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  
  # Requisições HTTP
  dio: ^5.4.0
  
  # Ícones
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
