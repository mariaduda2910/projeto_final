# pubspec.yaml - dependências do projeto

name: algarve_explorer
description: App de turismo do Algarve - TP3 Flutter
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Internacionalização
  intl: ^0.20.2

  # Variáveis de ambiente
  flutter_dotenv: ^5.1.0

  # Gerenciamento de estado
  provider: ^6.1.2

  # Persistência local simples
  shared_preferences: ^2.2.2

  # Geolocalização
  geolocator: ^10.1.0

  # Mapa interativo (open source, gratuito)
  flutter_map: ^7.0.0
  latlong2: ^0.9.0

  # Requisições HTTP
  dio: ^5.4.0

  #para abrir links externos (ex: Google Maps)
  url_launcher: ^6.3.0

  # Ícones
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - .env        # ← adicionar isto
